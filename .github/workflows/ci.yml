name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [24]
        include:
          # ghostsay promises Node 14+ (package.json engines), so test the oldest too.
          - { os: ubuntu-latest, node: 14 }
          - { os: ubuntu-latest, node: 18 }
          - { os: ubuntu-latest, node: 22 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # No install: ghostsay has no runtime dependencies and the tests need none.
      - run: node test/smoke.js

  smoke:
    name: Packed npx smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Pack and install like a user would
        run: |
          mkdir -p /tmp/pack /tmp/app
          npm pack --pack-destination /tmp/pack
          tar -tzf /tmp/pack/*.tgz | grep -q package/lib/scenes/sanfran.js
          cd /tmp/app && npm init -y >/dev/null && npm install /tmp/pack/*.tgz
          npx ghostsay --version
          npx ghostsay "hello from ci" --sanfran --still --no-color | grep -q "hello"
          npx ghostsay --beach --no-text --still --no-color
          echo "piped" | npx ghostsay --still --no-color | grep -q "piped"
